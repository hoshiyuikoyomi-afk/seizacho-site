<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星座帳 ── 星結こよみの記録帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --washi:#F3EDE1;       /* 被衣の白 */
    --washi-lit:#FAF6EC;
    --washi-edge:#E4DAC6;
    --shinku:#86242C;      /* 赤紐 */
    --shinku-soft:#963a41;
    --hana:#B23A32;        /* 花刺繍の紅(差し色) */
    --sumi:#2E2A26;
    --sumi-soft:#5c554c;
    --kincha:#806F60;      /* 温かい中間色 */
    --kuro:#202124;        /* 近未来側の黒 */
    --yozora:#17130E;      /* 温かい墨夜 */
    --yozora-2:#211B13;
    --star:#F3EDE1;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ -webkit-text-size-adjust:100%; }

  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 800px at 50% -10%, #F5EEDF 0%, #EDE4D0 55%, #E2D6BD 100%);
    color:var(--sumi);
    font-family:"Shippori Mincho", serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:clamp(18px,4vw,44px) 16px 40px;
    overflow-x:hidden;
    position:relative;
  }

  /* faint night specks behind everything */
  .sky-specks{
    display:none;
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      radial-gradient(1.2px 1.2px at 12% 22%, rgba(233,223,201,.45), transparent),
      radial-gradient(1px 1px at 78% 14%, rgba(233,223,201,.35), transparent),
      radial-gradient(1.4px 1.4px at 34% 68%, rgba(233,223,201,.30), transparent),
      radial-gradient(1px 1px at 62% 82%, rgba(233,223,201,.30), transparent),
      radial-gradient(1px 1px at 88% 58%, rgba(233,223,201,.25), transparent),
      radial-gradient(1.1px 1.1px at 22% 88%, rgba(233,223,201,.28), transparent),
      radial-gradient(1px 1px at 50% 40%, rgba(233,223,201,.20), transparent);
  }

  .wrap{ position:relative; z-index:1; width:100%; max-width:940px; display:flex; flex-direction:column; align-items:center; }

  /* ── masthead ── */
  header.mast{ text-align:center; margin-bottom:clamp(18px,3.2vw,30px); width:100%; }
  .mast .eyebrow{
    margin-bottom:10px; font-family:"Zen Kaku Gothic New",sans-serif; font-weight:400;
    font-size:10px; letter-spacing:.28em; text-indent:.28em; color:var(--shinku);
  }
  .mast h1{
    font-weight:500; letter-spacing:.42em;
    font-size:clamp(22px,4.4vw,30px);
    text-indent:.42em;
    color:var(--sumi);
  }
  .mast .sub{
    margin-top:10px;
    font-family:"Zen Kaku Gothic New", sans-serif; font-weight:300;
    letter-spacing:.28em; text-indent:.28em;
    font-size:clamp(10px,2.2vw,12px);
    color:var(--kincha);
  }
  .mast .intro{
    margin:18px auto 0; max-width:42em;
    font-family:"Klee One","Shippori Mincho",serif; font-size:clamp(13px,2.2vw,14.5px);
    line-height:1.9; color:var(--sumi-soft);
  }

  .site-nav{
    display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); width:100%; max-width:620px;
    margin:clamp(18px,3vw,26px) auto 0; border-top:1px solid rgba(46,42,38,.16);
    border-bottom:1px solid rgba(46,42,38,.16);
  }
  .site-nav button,.site-nav a{
    min-height:56px; padding:9px 10px; border:0; background:transparent; color:var(--sumi-soft);
    text-decoration:none; cursor:pointer; display:flex; flex-direction:column; justify-content:center;
    align-items:center; gap:2px; font-family:"Shippori Mincho",serif; font-size:14px;
    letter-spacing:.12em; transition:background .25s,color .25s;
  }
  .site-nav > * + *{ border-left:1px solid rgba(46,42,38,.12); }
  .site-nav small{
    font-family:"Zen Kaku Gothic New",sans-serif; font-size:9.5px; letter-spacing:.12em;
    color:var(--kincha); font-weight:400;
  }
  .site-nav button:hover,.site-nav a:hover{ background:rgba(255,255,255,.28); color:var(--sumi); }
  .site-nav button[aria-current]{ color:var(--shinku); background:rgba(134,36,44,.045); }

  /* ── view toggle + nav ── */
  .controls{
    width:100%; display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    gap:16px; margin-bottom:clamp(14px,2.6vw,22px);
  }
  .latest-button{
    justify-self:start; border:0; background:none; color:var(--shinku); cursor:pointer;
    font-family:"Zen Kaku Gothic New",sans-serif; font-size:11px; letter-spacing:.12em;
    padding:8px 4px; opacity:.82;
  }
  .latest-button[hidden]{ display:block; visibility:hidden; }

  .pager{ display:flex; align-items:center; gap:12px; grid-column:2; }
  .pager .where{ display:flex; flex-direction:column; align-items:center; min-width:130px; gap:2px; }
  .pager .idx{
    font-family:"Zen Kaku Gothic New", sans-serif; font-weight:300;
    font-size:11px; letter-spacing:.18em; color:var(--shinku); min-width:52px; text-align:center;
  }
  .pager .range{ font-family:"Zen Kaku Gothic New",sans-serif; font-size:10px; letter-spacing:.08em; color:var(--kincha); }
  .pager button{
    background:none; border:none; cursor:pointer; color:var(--sumi);
    font-size:20px; line-height:1; padding:6px 8px; opacity:.75; transition:opacity .3s;
  }
  .pager button:hover{ opacity:1; }
  .pager button[aria-disabled="true"]{ opacity:.2; cursor:default; pointer-events:none; }

  :focus-visible{ outline:1.5px solid var(--kincha); outline-offset:3px; border-radius:2px; }

  /* ── the open book (spread) ── */
  .book{
    width:100%; position:relative;
    display:grid; grid-template-columns:1fr 1fr;
    background:linear-gradient(180deg,#eadfc9 0 6px,#8c3033 6px,#70242a 72%,#5d2024);
    padding:6px 6px 7px;
    border:1px solid rgba(117,48,39,.22);
    border-top-color:var(--washi-edge);
    border-radius:5px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.5) inset,
      0 22px 44px -22px rgba(80,60,30,.35),
      0 2px 8px rgba(80,60,30,.14);
    overflow:visible;
    animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }

  /* paper block sits above the muted red cover and behind the writable leaves */
  .book::before{
    content:""; position:absolute; inset:3px 2px 1px 4px; pointer-events:none; z-index:1;
    border-radius:3px; border:1px solid rgba(137,98,63,.22);
    background:#eadfc9;
    box-shadow:0 2px 0 rgba(255,249,231,.7),0 4px 5px rgba(82,46,31,.16);
  }
  /* gutter shadow */
  .book::after{
    content:""; position:absolute; top:0; bottom:0; left:50%; width:60px; transform:translateX(-50%);
    z-index:3; pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(90,70,45,.11) 42%, rgba(90,70,45,.20) 50%, rgba(90,70,45,.11) 58%, transparent);
  }
  /* 赤紐は見開き中央ではなく、帳面の外縁に置く。穴・折返し・交差を一体で描く。 */
  .cord{ position:absolute; top:10px; bottom:10px; left:-13px; width:32px; z-index:4; pointer-events:none; opacity:.92; overflow:visible; }
  .cord-shaft{ position:absolute; top:0; bottom:0; left:14px; width:3px; background:linear-gradient(90deg,rgba(89,24,31,.7),var(--shinku) 45%,rgba(190,73,66,.55) 74%,rgba(89,24,31,.46)); border-radius:2px; box-shadow:1px 0 1px rgba(53,20,23,.24); }
  .cord > svg{ display:block; overflow:visible; }
  .cord .cord-knot-fixed{ position:absolute; top:22%; left:-4px; width:40px; height:88px; }
  .cord .cord-shadow{ stroke:rgba(71,28,25,.23); stroke-width:3.2; fill:none; stroke-linecap:round; }
  .cord .cord-line{ stroke:var(--shinku); stroke-width:2.25; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .cord .cord-highlight{ stroke:rgba(196,91,79,.5); stroke-width:.7; fill:none; stroke-linecap:round; }
  .cord .cord-hole{ fill:#49352d; stroke:rgba(255,248,230,.58); stroke-width:1; }
  .cord .cord-knot{ fill:var(--shinku); stroke:#681c25; stroke-width:.8; }

  .page{ position:relative; z-index:2; padding:clamp(22px,3.4vw,40px) clamp(20px,3.2vw,38px); min-height:clamp(360px,52vw,480px); display:flex; flex-direction:column; background-image:linear-gradient(105deg,rgba(255,252,242,.88),rgba(241,231,211,.80) 58%,rgba(219,201,173,.70)),url("assets/washi-paper.png"); background-size:100% 100%,640px 640px; background-position:center,center; box-shadow:1px 0 0 rgba(136,84,50,.22),-1px 0 0 rgba(136,84,50,.16),0 2px 0 rgba(109,61,39,.18),0 4px 0 rgba(243,232,210,.72),0 6px 5px rgba(91,47,31,.14); }
  .page::before{ content:""; position:absolute; inset:0; z-index:0; background:linear-gradient(90deg,rgba(102,62,34,.08),transparent 10%,transparent 90%,rgba(102,62,34,.06)); pointer-events:none; }
  .page::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:12px; z-index:0; background:linear-gradient(0deg,rgba(122,77,45,.10),transparent); pointer-events:none; }
  .page > *{ position:relative; z-index:1; }
  .page.left{ padding-right:clamp(30px,4vw,52px); }
  .page.right{ padding-left:clamp(30px,4vw,52px); }
  .page.blank .date, .page.blank .field, .page.blank .memo, .page.blank .naming{ visibility:hidden; }
  .page[hidden]{ display:none; }

  .date{
    font-size:clamp(16px,2.6vw,20px); font-weight:500; color:var(--sumi);
    letter-spacing:.08em; margin-bottom:clamp(10px,1.6vw,16px);
  }
  .field{ position:relative; margin:2px 0 clamp(14px,2vw,20px); }
  .field svg{ width:100%; height:auto; display:block; }

  .naming{ display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
  .naming .mark{ color:var(--hana); font-size:12px; transform:translateY(-2px); opacity:.85; }
  .naming .name{ font-size:clamp(16px,2.5vw,19px); font-weight:600; color:var(--sumi); letter-spacing:.04em; }

  .memo{
    font-family:"Klee One", "Shippori Mincho", serif; font-weight:400;
    font-size:clamp(13px,2.1vw,15px); line-height:2.0; color:#3b352e;
    max-width:34ch;
  }
  .vodlink{ margin-top:clamp(12px,2vw,16px); }
  .vodlink a{
    font-family:"Zen Kaku Gothic New",sans-serif; font-weight:300;
    font-size:11.5px; letter-spacing:.14em; text-decoration:none;
    color:var(--sumi-soft); opacity:.75;
    border-bottom:1px solid rgba(92,85,76,.3);
    transition:opacity .3s;
  }
  .vodlink a:hover{ opacity:1; }
  .entry-meta{ margin-top:12px; display:flex; flex-wrap:wrap; gap:10px 16px; }
  .entry-meta a{
    font-family:"Zen Kaku Gothic New",sans-serif; font-size:10.5px; letter-spacing:.1em;
    color:var(--sumi-soft); opacity:.72; text-decoration:none;
    border-bottom:1px solid rgba(92,85,76,.28);
  }
  .entry-meta a:hover{ opacity:1; }
  .yohaku{ flex:1 1 auto; min-height:24px; } /* 余白 */

  /* star points / lines */
  .cline{ stroke:#40372f; stroke-width:.42; opacity:.54; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .cstar{ fill:#302a25; stroke:rgba(91,65,50,.44); stroke-width:.15; }
  .twinkle{ animation:none; }
  @keyframes tw{ 0%,100%{ opacity:.9; } 50%{ opacity:.55; } }

  /* ── year sky ── */
  .sky{
    --star:#f7f4ed;
    width:100%; position:relative; display:none;
    background:#080f19;
    padding:clamp(28px,4.4vw,42px) clamp(20px,4vw,46px) clamp(26px,4vw,38px);
    overflow:hidden;
    animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both;
  }
  .sky > *{ position:relative; z-index:1; }
  .sky-head{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:12px; }
  .sky-years{ display:flex; gap:4px; justify-content:center; flex-wrap:wrap; }
  .sky-years button{
    border:0; border-bottom:1px solid transparent; background:transparent;
    color:rgba(247,244,237,.76); font-family:"Zen Kaku Gothic New",sans-serif;
    font-size:12px; letter-spacing:.12em; padding:5px 10px; min-height:44px; cursor:pointer;
  }
  .sky-years button[aria-pressed="true"]{ color:var(--washi); border-bottom-color:rgba(243,237,225,.48); }
  .sky.on{ display:block; }
  .book.off{ display:none; }
  .sky-title{ text-align:center; letter-spacing:.36em; text-indent:.36em; font-size:clamp(15px,2.8vw,19px); color:var(--washi); margin-bottom:6px; }
  .sky-note{ text-align:center; font-family:"Zen Kaku Gothic New",sans-serif; font-weight:300; font-size:11px; letter-spacing:.16em; color:rgba(247,244,237,.78); margin-bottom:16px; }
  .sky svg{ width:100%; height:auto; display:block; }
  .sky-scroll{ width:100%; }
  .sky-map{ position:relative; width:100%; min-height:320px; }
  .sky-map > svg{ position:absolute; left:0; top:0; }
  /* 旧・月別レイアウトの区画線は描画しない */
  .sky .month-cell,.sky .month-label{ display:none !important; }
  .sky .yline{ stroke:var(--star); stroke-width:.75; opacity:.62; fill:none; stroke-linecap:round; vector-effect:non-scaling-stroke; }
  .cluster-hit{ fill:transparent; pointer-events:all; }
  .cluster .ystar{ fill:var(--star); opacity:.95; stroke:rgba(247,244,237,.48); stroke-width:.45; vector-effect:non-scaling-stroke; transition:opacity .5s, fill .5s; }
  .cluster .yline,.cluster .ystar,.cluster .ylabel{ pointer-events:none; }
  .cluster .ylabel{ display:none; }
  .sky-label{ position:absolute; display:flex; align-items:center; justify-content:center; min-height:44px; padding:7px 6px; color:rgba(225,232,239,.70); font-family:"Shippori Mincho",serif; font-size:11px; line-height:1.4; letter-spacing:.04em; text-align:center; text-decoration:none; white-space:normal; z-index:3; text-shadow:none; }
  .sky-label:hover,.sky-label:focus-visible,.sky-label.active{ color:#eeeef0; text-shadow:none; }
  .cluster.active .ystar{ opacity:1; stroke:rgba(255,250,240,.62); stroke-width:.55; }
  .cluster.active .yline{ opacity:.82; }
  .cluster:hover .ystar, .cluster:focus-within .ystar{ opacity:1; }
  .cluster:hover .yline, .cluster:focus-within .yline{ opacity:.82; }
  .cluster:hover .ylabel, .cluster:focus-within .ylabel{ opacity:.85; }
  .cluster:focus-visible .cluster-hit{ stroke:rgba(243,237,225,.45); stroke-width:1; }
  .cluster{ cursor:pointer; }
  #bookControls[hidden]{ display:none; }

  /* ── footer ── */
  footer.foot{ margin-top:clamp(26px,4vw,42px); text-align:center; max-width:520px; }
  footer.foot .line{
    font-family:"Zen Kaku Gothic New", sans-serif; font-weight:300;
    font-size:12px; letter-spacing:.14em; line-height:2; color:var(--sumi-soft);
    opacity:.85;
  }
  footer.foot .line.dim{ color:var(--kincha); opacity:.7; font-size:11px; margin-top:6px; }
  footer.foot .links{ margin-top:14px; display:flex; gap:20px; justify-content:center; }
  footer.foot a{ color:var(--shinku); text-decoration:none; font-size:11px; letter-spacing:.12em; }

  /* ── mobile: pages stack, book becomes single-page metaphor ── */
  @media (max-width:640px){
    .book{ grid-template-columns:1fr; }
    .book::after{ display:none; }
    .book{ margin-left:3px; width:calc(100% - 3px); padding:5px 5px 6px; box-shadow:0 18px 34px -20px rgba(80,60,30,.42),0 2px 8px rgba(80,60,30,.14); }
    .cord{ left:-8px; width:25px; }
    .cord .cord-knot-fixed{ left:-3px; width:32px; height:70px; }
    .page.left{ padding-right:clamp(20px,3.2vw,38px); }
    .page.right{ padding-left:clamp(20px,3.2vw,38px); }
    .page{ min-height:auto; padding-top:clamp(26px,7vw,34px); padding-bottom:clamp(26px,7vw,34px); }
    .memo{ max-width:none; }
    .controls{ grid-template-columns:1fr; }
    .latest-button{ display:none !important; }
    .pager{ grid-column:1; justify-content:space-between; width:100%; }
    .pager .where{ min-width:110px; }
    .site-nav button,.site-nav a{ min-height:52px; font-size:12.5px; letter-spacing:.06em; padding:7px 5px; }
    .site-nav small{ font-size:8.5px; letter-spacing:.05em; }
    .mast .intro{ text-align:left; max-width:31em; }
    .sky-map{ min-height:390px; }
  .sky-label{ max-width:104px; font-size:11px; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; }
  }
</style>
</head>
<body>
<div class="sky-specks" aria-hidden="true"></div>

<div class="wrap">
  <header class="mast">
    <div class="eyebrow">HOSHIYUI KOYOMI</div>
    <h1>星座帳</h1>
    <div class="sub">星結こよみ の 記録帳</div>
    <p class="intro">いくつかの出来事が、あとから一つの形に見えた日だけ、名前をつけて残しています。</p>
    <nav class="site-nav" aria-label="星座帳の案内">
      <button id="tab-book" type="button" aria-current="page"><span>星座帳</span><small>記録を読む</small></button>
      <button id="tab-sky" type="button"><span>一年の空</span><small>星座をたどる</small></button>
      <a href="koyomi.html"><span>こよみについて</span><small>帳面のもちぬし</small></a>
    </nav>
  </header>

  <div class="controls" id="bookControls">
    <button class="latest-button" id="latest" type="button">最新の星座へ</button>
    <div class="pager" id="pager">
      <button id="prev" type="button" aria-label="前の星座">‹</button>
      <span class="where"><span class="idx" id="idx"></span><span class="range" id="range"></span></span>
      <button id="next" type="button" aria-label="次の星座">›</button>
    </div>
  </div>

  <!-- spread -->
    <section class="book" id="book" aria-label="星座帳の見開き">
    <span class="cord" aria-hidden="true"><span class="cord-shaft"></span><svg class="cord-knot-fixed" viewBox="0 0 40 88" focusable="false">
      <ellipse class="cord-hole" cx="20" cy="43" rx="5" ry="6"/>
      <path class="cord-line" d="M19 43C4 33 3 19 9 15c7-5 14 5 10 25C26 21 32 10 37 16c5 7-2 20-17 27M20 47c-1 11-5 22-10 31M20 47c2 11 7 21 13 29"/>
      <path class="cord-shadow" d="M20 42C5 32 4 20 10 16M20 43C25 22 32 11 36 17"/>
      <circle class="cord-knot" cx="20" cy="44" r="4"/>
    </svg></span>
    <div class="page left"  id="pageL"></div>
    <div class="page right" id="pageR"></div>
  </section>

  <!-- year sky -->
  <section class="sky" id="sky" aria-label="一年の空" hidden>
    <div class="sky-head">
      <div class="sky-title" id="skyTitle"></div>
      <div class="sky-note">一年分の星が、ひとつの空に集まる</div>
      <div class="sky-years" id="skyYears" role="group" aria-label="年を選ぶ"></div>
    </div>
    <div class="sky-scroll" id="skyCanvas"></div>
  </section>

  <footer class="foot">
    <div class="line">いくつかの出来事が、一つの形に見えた日だけここに残ります。</div>
    <div class="line dim">点はその日の出来事の数。個別の誰かや言葉は公開しません。</div>
    <div class="links"><a href="https://x.com/h_koyomi_ai" rel="noopener">X</a><a href="koyomi.html">こよみについて</a></div>
  </footer>
</div>

<script>
/* ── 公開用データ(公開層のみ。内部層の項目は持たない) ──
   schema: { date:"YYYY-MM-DD", name:"…座", diary:"短い日記", stars:整数(星の数) }
   データは entries.json(人間が承認した公開用エクスポート)から読み込む */
let ENTRIES = [];

/* ── 漢数字の日付 ── */
const K=['〇','一','二','三','四','五','六','七','八','九'];
function kNum(n){
  if(n<10) return K[n];
  if(n===10) return '十';
  if(n<20) return '十'+K[n-10];
  if(n===20) return '二十';
  if(n<30) return '二十'+(n>20?K[n-20]:'');
  if(n===30) return '三十';
  return '三十'+K[n-30];
}
function kDate(iso){ const [ ,m,d]=iso.split('-').map(Number); return `${kNum(m)}月${kNum(d)}日`; }
function kYear(iso){ const y=iso.split('-')[0]; return [...y].map(c=>K[+c]).join('')+'年'; }

/* ── 決定論的ハッシュ(日付/IDから座標を決める) ── */
function h01(str){
  let h=2166136261>>>0;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  h>>>=0; return h/4294967296;
}

/* ── 星の種: hoshiトークン配列があればそれを、無ければ日付+連番を種にする ── */
function starSeeds(entry){
  if(entry.hoshi && entry.hoshi.length) return entry.hoshi;
  return Array.from({length:entry.stars||0},(_,i)=> entry.date+':'+i);
}

/* ── 星の配置(グリッド+ハッシュのゆらぎ。点1つ=種1つ) ── */
function placeStars(seeds,W,H,pad){
  const count=seeds.length;
  const cols=Math.ceil(Math.sqrt(count)), rows=Math.ceil(count/cols);
  const cw=(W-2*pad)/cols, ch=(H-2*pad)/rows, pts=[];
  for(let i=0;i<count;i++){
    const gx=i%cols, gy=Math.floor(i/cols);
    const x=pad+cw*(gx+0.18+0.64*h01(seeds[i]+':x'));
    const y=pad+ch*(gy+0.18+0.64*h01(seeds[i]+':y'));
    pts.push({x,y,r:0.8+1.1*h01(seeds[i]+':r')});
  }
  return pts;
}
/* ── 最近傍で星をつなぐ(星座線) ── */
function chain(pts){
  if(pts.length<2) return [];
  const used=Array(pts.length).fill(false); let cur=0; used[0]=true; const order=[0];
  for(let k=1;k<pts.length;k++){
    let best=-1,bd=1e9;
    for(let j=0;j<pts.length;j++){ if(used[j])continue;
      const d=(pts[j].x-pts[cur].x)**2+(pts[j].y-pts[cur].y)**2; if(d<bd){bd=d;best=j;} }
    used[best]=true; order.push(best); cur=best;
  }
  return order;
}
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }

/* ── 両ビュー共通の星図: 日記の座標・星の大きさ・結び方を使う ── */
function constellationGeometry(entry){
  const W=100,H=64;
  const seeds=starSeeds(entry),pts=placeStars(seeds,W,H,12);
  let dd="";
  chain(pts).forEach((idx,i)=>{ const p=pts[idx]; dd+=(i?"L":"M")+p.x.toFixed(2)+" "+p.y.toFixed(2)+" "; });
  return {W,H,seeds,pts,pathData:dd.trim()};
}

/* ── ページの星図SVG ── */
function pageStarSVG(entry){
  const {W,H,seeds,pts,pathData}=constellationGeometry(entry);
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`, "aria-hidden":"true"});
  const defs=el("defs",{});
  const filterId="ink-"+entry.date.replace(/[^0-9a-z]/gi,"");
  const filter=el("filter",{id:filterId,x:"-2",y:"-2",width:"104",height:"68",filterUnits:"userSpaceOnUse",primitiveUnits:"userSpaceOnUse","color-interpolation-filters":"sRGB"});
  filter.appendChild(el("feTurbulence",{type:"fractalNoise",baseFrequency:"1.7",numOctaves:"2",seed:"7",result:"fiber"}));
  filter.appendChild(el("feDisplacementMap",{in:"SourceGraphic",in2:"fiber",scale:"0.16",xChannelSelector:"R",yChannelSelector:"G"}));
  defs.appendChild(filter); svg.appendChild(defs);
  // lines
  const path=el("path",{d:pathData, class:"cline",filter:`url(#${filterId})`}); svg.appendChild(path);
  // stars
  pts.forEach((p,i)=>{
    const c=el("circle",{cx:p.x.toFixed(2),cy:p.y.toFixed(2),r:p.r.toFixed(2),class:"cstar twinkle",tabindex:"0",role:"img",filter:`url(#${filterId})`});
    c.style.animationDelay=(h01(seeds[i]+':d')*6).toFixed(2)+"s";
    svg.appendChild(c);
  });
  return svg;
}

/* ── ページ描画 ── */
function renderPage(node,entry){
  node.classList.toggle("blank", !entry);
  node.innerHTML="";
  if(!entry){ return; }
  const date=document.createElement("div"); date.className="date"; date.textContent=kDate(entry.date);
  const field=document.createElement("div"); field.className="field"; field.appendChild(pageStarSVG(entry));
  const naming=document.createElement("div"); naming.className="naming";
  naming.innerHTML=`<span class="mark">✦</span><span class="name"></span>`;
  naming.querySelector(".name").textContent=entry.name;
  const memo=document.createElement("div"); memo.className="memo"; memo.textContent=entry.diary;
  const yohaku=document.createElement("div"); yohaku.className="yohaku";
  node.append(date,field,naming,memo);
  if(entry.url){
    const v=document.createElement("div"); v.className="vodlink";
    const a=document.createElement("a");
    a.href=entry.url; a.target="_blank"; a.rel="noopener";
    a.textContent="この日の配信 ›";
    v.appendChild(a); node.appendChild(v);
  }
  const meta=document.createElement("div"); meta.className="entry-meta";
  const permalink=document.createElement("a");
  permalink.href=`?date=${encodeURIComponent(entry.date)}`;
  permalink.textContent="この星座へのリンク";
  meta.appendChild(permalink); node.appendChild(meta);
  node.appendChild(yohaku);
}

/* ── 見開きのページング ── */
const mobileView=window.matchMedia("(max-width:640px)");
let perView=mobileView.matches?1:2;
let spread=0;
let spreads=1;
function itemsPerView(){ return mobileView.matches?1:2; }
function recalcSpreads(){ perView=itemsPerView(); spreads=Math.max(1,Math.ceil(ENTRIES.length/perView)); }
function pageForEntry(index){ return Math.floor(index/perView); }
function updatePageUrl(entry){
  if(!entry) return;
  const u=new URL(window.location.href); u.searchParams.delete("view"); u.searchParams.set("date",entry.date);
  history.replaceState(null,"",u);
}
function updateViewUrl(view){
  const u=new URL(window.location.href);
  if(view==="sky"){ u.searchParams.set("view","sky"); u.searchParams.delete("date"); }
  else u.searchParams.delete("view");
  history.replaceState(null,"",u);
}
function renderSpread(){
  const start=spread*perView;
  const L=ENTRIES[start], R=perView===2?ENTRIES[start+1]:null;
  document.getElementById("pageR").hidden=perView===1;
  renderPage(document.getElementById("pageL"),L);
  renderPage(document.getElementById("pageR"),R);
  document.getElementById("idx").textContent=kNum(spread+1)+" / "+kNum(spreads);
  const shown=[L,R].filter(Boolean);
  document.getElementById("range").textContent=shown.length>1?`${kDate(L.date)} — ${kDate(R.date)}`:(L?kDate(L.date):"");
  const prev=document.getElementById("prev"), next=document.getElementById("next");
  prev.setAttribute("aria-disabled", spread<=0);
  next.setAttribute("aria-disabled", spread>=spreads-1);
  document.getElementById("latest").hidden=spread>=spreads-1;
}
function movePage(delta){
  const nextPage=Math.max(0,Math.min(spreads-1,spread+delta));
  if(nextPage===spread) return;
  spread=nextPage; renderSpread(); updatePageUrl(ENTRIES[spread*perView]);
}
document.getElementById("prev").onclick=()=>movePage(-1);
document.getElementById("next").onclick=()=>movePage(1);
document.getElementById("latest").onclick=()=>{ spread=spreads-1; renderSpread(); updatePageUrl(ENTRIES[ENTRIES.length-1]); };

/* ── 年間ビュー(一枚の空) ── */
let selectedYear=null;
function renderYearButtons(){
  const years=[...new Set(ENTRIES.map(e=>e.date.slice(0,4)))].sort();
  const host=document.getElementById("skyYears"); host.innerHTML="";
  years.forEach(year=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=year;
    b.setAttribute("aria-pressed",year===selectedYear);
    b.onclick=()=>{ selectedYear=year; renderSky(); };
    host.appendChild(b);
  });
}

/* ── 星座の中心配置: ランダム感を保ちつつ、操作領域だけは重ねすぎない ── */
function placeClusters(items,W,H,pad){
  const area=(W-2*pad)*(H-2*pad);
  const minDistance=Math.max(60,Math.min(80,Math.sqrt(area/Math.max(items.length,1))*.72));
  const hitRadius=Math.max(26,minDistance/2-4);
  const centers=[];

  items.forEach(({entry})=>{
    const baseX=h01(entry.date+':cluster:x');
    const baseY=h01(entry.date+':cluster:y');
    let best=null, bestDistance=-1;
    for(let attempt=0;attempt<192;attempt++){
      const candidate={
        x:pad+(W-2*pad)*((baseX+attempt*.61803398875)%1),
        y:pad+(H-2*pad)*((baseY+attempt*.75487766625)%1)
      };
      const nearest=centers.length
        ? Math.min(...centers.map(p=>Math.hypot(candidate.x-p.x,candidate.y-p.y)))
        : Infinity;
      if(nearest>bestDistance){ best={...candidate,hitRadius}; bestDistance=nearest; }
      if(nearest>=minDistance) break;
    }
    centers.push(best);
  });
  return centers;
}

function renderSky(){
  const W=1000,H=600,pad=80;
  const canvas=document.getElementById("skyCanvas"); canvas.innerHTML="";
  const map=document.createElement("div"); map.className="sky-map";
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,"aria-hidden":"false","aria-label":"一年の星座"});
  const yearEntries=ENTRIES.map((entry,index)=>({entry,index})).filter(x=>x.entry.date.startsWith(selectedYear+"-"));
  const centers=placeClusters(yearEntries,W,H,pad);
  yearEntries.forEach(({entry, index:entryIdx},entryNo)=>{
    const {x:cx,y:cy,hitRadius}=centers[entryNo];
    const {W:shapeW,H:shapeH,pts,pathData}=constellationGeometry(entry);
    const labelId="sky-label-"+entry.date;
    const g=el("g",{class:"cluster",tabindex:"0",role:"button","aria-label":entry.name,"data-label-id":labelId});
    const radius=Math.max(hitRadius,...pts.map(p=>Math.hypot(p.x-shapeW/2,p.y-shapeH/2)+p.r+1));
    g.appendChild(el("circle",{cx:cx.toFixed(1),cy:cy.toFixed(1),r:radius.toFixed(1),class:"cluster-hit"}));
    // Move the diary shape to its annual center without stretching or recalculating it.
    const shape=el("g",{class:"constellation-shape",transform:`translate(${cx-shapeW/2} ${cy-shapeH/2})`});
    shape.appendChild(el("path",{d:pathData,class:"yline"}));
    pts.forEach(p=> shape.appendChild(el("circle",{cx:p.x.toFixed(2),cy:p.y.toFixed(2),r:p.r.toFixed(2),class:"ystar"})));
    g.appendChild(shape);
    const jump=()=>{ spread=pageForEntry(entryIdx); renderSpread(); show("book"); updatePageUrl(entry); window.scrollTo({top:0,behavior:"smooth"}); };
    g.addEventListener("click",jump);
    g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); jump(); } });
    svg.appendChild(g);
    const label=document.createElement("a"); label.className="sky-label"; label.id=labelId; label.href=`?date=${encodeURIComponent(entry.date)}`; label.textContent=entry.name; label.dataset.cx=cx; label.dataset.cy=cy; label.dataset.radius=radius; label.dataset.entryIndex=entryIdx; label.addEventListener("click",e=>{ e.preventDefault(); jump(); });
    const updateEmphasis=()=>{
      const active=label.matches(":hover,:focus")||g.matches(":hover,:focus");
      label.classList.toggle("active",active); g.classList.toggle("active",active);
    };
    [label,g].forEach(node=>["mouseenter","mouseleave","focus","blur"].forEach(event=>node.addEventListener(event,updateEmphasis)));
    map.appendChild(label);
  });
  map.insertBefore(svg,map.firstChild); canvas.appendChild(map);
  observeSkyLabels();
  requestAnimationFrame(layoutSkyLabels);
  document.getElementById("skyTitle").textContent=[...selectedYear].map(c=>K[+c]).join("")+"年の空";
  renderYearButtons();
}

function layoutSkyLabels(){
  const map=document.querySelector(".sky-map"), svg=map&&map.querySelector(":scope > svg");
  if(!map||!svg||!map.clientWidth) return;
  const width=map.clientWidth, scale=width/1000, svgH=600*scale;
  const labels=[...map.querySelectorAll(".sky-label")];
  const clusters=[...svg.querySelectorAll(".cluster")];
  map.classList.remove("crowded"); map.style.minHeight="0";
  const labelWidth=Math.min(width<440?104:180,(width-20)/2);
  labels.forEach(label=>{ label.style.width=labelWidth+"px"; });
  const sizes=labels.map(label=>({w:labelWidth,h:Math.max(44,label.offsetHeight)}));
  const anchors=labels.map(label=>({x:+label.dataset.cx*scale,y:+label.dataset.cy*scale}));
  // Preserve the original center positions and map proportions. A small uniform
  // enlargement improves visibility without redistributing the constellations.
  const glyphScale=1.22;
  svg.setAttribute("viewBox","0 0 1000 600");
  clusters.forEach((g,i)=>{
    const cx=+labels[i].dataset.cx, cy=+labels[i].dataset.cy;
    g.setAttribute("transform",`translate(${cx} ${cy}) scale(${glyphScale}) translate(${-cx} ${-cy})`);
  });
  const bounds=clusters.map((g,i)=>{
    const b=g.getBBox(),cx=+labels[i].dataset.cx,cy=+labels[i].dataset.cy;
    return {x:(cx+(b.x-cx)*glyphScale)*scale-6,y:(cy+(b.y-cy)*glyphScale)*scale-6,w:b.width*glyphScale*scale+12,h:b.height*glyphScale*scale+12};
  });
  const overlaps=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
  const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
  const nearest=anchors.map((p,i)=>Math.min(...anchors.filter((_,j)=>j!==i).map(q=>Math.hypot(p.x-q.x,p.y-q.y))));
  const order=anchors.map((_,i)=>i).sort((a,b)=>nearest[a]-nearest[b]||anchors[b].x-anchors[a].x);
  let positions=null, mapH=Math.max(labels.length>1?430:360,svgH+100), offset=0;
  // Retry with extra label space, never by moving constellation centers.
  if(labels.length<=12) for(let height=mapH;height<=Math.max(mapH,640);height+=70){
    const top=(height-svgH)/2, boxes=bounds.map(b=>({...b,y:b.y+top}));
    let options=[{positions:[],placed:[],score:0}];
    for(const i of order){
      const {w,h}=sizes[i], cx=anchors[i].x, cy=anchors[i].y+top;
      const xs=[...new Set([cx-w/2,cx-w-18,cx+18,4,width-w-4,(width-w)/2].map(x=>clamp(x,4,width-w-4)))];
      const candidates=[];
      for(let y=4;y<=height-h-4;y+=10) for(const x of xs){
        const rect={x,y,w,h};
        if(boxes.some(b=>overlaps(rect,b))) continue;
        const distance=Math.hypot(x+w/2-cx,y+h/2-cy);
        const other=Math.min(...anchors.filter((_,j)=>j!==i).map(a=>Math.hypot(x+w/2-a.x,y+h/2-a.y-top)));
        candidates.push({rect,score:distance*distance+Math.max(0,distance-other)*100});
      }
      candidates.sort((a,b)=>a.score-b.score);
      const next=[];
      for(const option of options) for(const candidate of candidates.slice(0,60)){
        const r=candidate.rect,padded={x:r.x-4,y:r.y-4,w:r.w+8,h:r.h+8};
        if(option.placed.some(p=>overlaps(padded,p))) continue;
        const positions=option.positions.slice();positions[i]=r;
        next.push({positions,placed:[...option.placed,r],score:option.score+candidate.score});
      }
      next.sort((a,b)=>a.score-b.score);
      options=next.slice(0,80);
      if(!options.length) break;
    }
    if(options.length){ positions=options[0].positions; mapH=height; offset=top; break; }
  }
  // Dense years retain every full name below the unchanged constellation map.
  if(!positions){
    map.classList.add("crowded"); positions=[]; offset=0;
    const columns=width<260?1:2, gap=14, colWidth=(width-8-gap*(columns-1))/columns;
    let y=svgH+28;
    for(let i=0;i<labels.length;i+=columns){
      let rowHeight=44;
      for(let c=0;c<columns&&i+c<labels.length;c++){
        const label=labels[i+c], w=Math.min(210,colWidth); label.style.width=w+"px";
        const h=Math.max(44,label.offsetHeight); rowHeight=Math.max(rowHeight,h);
        positions[i+c]={x:4+c*(colWidth+gap)+(colWidth-w)/2,y,w,h};
      }
      y+=rowHeight+10;
    }
    mapH=y+8;
  }
  map.style.height=mapH+"px"; svg.style.top=offset+"px"; svg.style.height=svgH+"px";
  labels.forEach((label,i)=>{
    label.style.left=positions[i].x+"px";
    label.style.top=positions[i].y+"px";
  });
}

let skyLabelObserver=null;
let skyLabelWidth=0;
function observeSkyLabels(){
  if(skyLabelObserver) skyLabelObserver.disconnect();
  const map=document.querySelector(".sky-map"); if(!map||!window.ResizeObserver) return;
  skyLabelWidth=map.clientWidth;
  skyLabelObserver=new ResizeObserver(entries=>{ const width=entries[0].contentRect.width; if(width&&Math.abs(width-skyLabelWidth)>0.5){ skyLabelWidth=width; requestAnimationFrame(layoutSkyLabels); } }); skyLabelObserver.observe(map);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>requestAnimationFrame(layoutSkyLabels));
}

/* ── ビュー切り替え ── */
const tabBook=document.getElementById("tab-book"), tabSky=document.getElementById("tab-sky");
const book=document.getElementById("book"), sky=document.getElementById("sky"), bookControls=document.getElementById("bookControls");
function show(view){
  const isBook=view==="book";
  tabBook.toggleAttribute("aria-current",isBook); tabSky.toggleAttribute("aria-current",!isBook);
  book.classList.toggle("off",!isBook); book.toggleAttribute("hidden",!isBook);
  sky.classList.toggle("on",!isBook); sky.toggleAttribute("hidden",isBook);
  bookControls.hidden=!isBook;
  if(!isBook) renderSky();
}
tabBook.onclick=()=>{ show("book"); updateViewUrl("book"); };
tabSky.onclick=()=>{ show("sky"); updateViewUrl("sky"); };

/* ── 起動: entries.json を読み込んで描画 ── */
async function init(){
  try{
    const res=await fetch("entries.json",{cache:"no-cache"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data=await res.json();
    ENTRIES=data.slice().sort((a,b)=> a.date<b.date ? -1 : 1);
    recalcSpreads();
    selectedYear=ENTRIES.length?ENTRIES[ENTRIES.length-1].date.slice(0,4):String(new Date().getFullYear());
    const requested=new URLSearchParams(location.search).get("date");
    const requestedIndex=ENTRIES.findIndex(e=>e.date===requested);
    spread=requestedIndex>=0?pageForEntry(requestedIndex):spreads-1;
    renderSpread();
    show(new URLSearchParams(location.search).get("view")==="sky"?"sky":"book");
  }catch(err){
    console.error("entries.json の読み込みに失敗:", err);
    document.getElementById("pageL").innerHTML=
      '<div class="date">帳面をひらけませんでした</div>'+
      '<div class="memo">すこし時間をおいて、また来てみてください。</div>';
    document.getElementById("idx").textContent="";
  }
}
mobileView.addEventListener("change",()=>{
  const currentIndex=Math.min(spread*perView,Math.max(0,ENTRIES.length-1));
  recalcSpreads(); spread=pageForEntry(currentIndex); renderSpread();
});
init();
</script>
